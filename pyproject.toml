[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor"
version = "1.1.0"
description = "One command to diagnose a Linux desktop (crashes, memory, disks, hardware, services, logs, updates, security), free disk space safely, and apply the fixes you pick"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
doctor = "doctor.cli:main"
disk-clean = "disk_clean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disk_clean = ["quick.sh"]
